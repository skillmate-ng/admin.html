<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Skill Mate — Admin Console</title>
<meta name="description" content="Admin console for Skill Mate: verify businesses, remove fake listings, manage reports and users."/>
<meta name="theme-color" content="#ffffff" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#ffffff;--surface-2:#f4f6f9;--line:#e7ebf0;--text:#12181f;--muted:#69737f;
--primary:#2f5eff;--primary-2:#00c2a8;--accent:#ffb400;--danger:#e6484f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}
h1,h2,h3{font-family:Sora,sans-serif;margin:0;letter-spacing:-.02em}
.wrap{width:min(1200px,94vw);margin:0 auto}
header{border-bottom:1px solid var(--line);padding:16px 0;background:rgba(255,255,255,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.gold{background:var(--accent);color:#3a2900}
input,select{padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-family:inherit;outline:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 16px 40px -26px rgba(20,30,60,.20)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 16px 40px -26px rgba(20,30,60,.20)}
.kpi b{font-family:Sora;font-size:26px;display:block}.kpi span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.badge{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:rgba(47,94,255,.10);color:var(--primary)}
.badge.gold{background:rgba(255,180,0,.15);color:#a06a00}
.badge.red{background:rgba(230,72,79,.12);color:var(--danger)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs button{padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.login{display:grid;place-items:center;min-height:80vh}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border:1px solid var(--text);padding:12px 18px;border-radius:12px;font-weight:600}
.chat-list{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--surface-2);max-height:70vh}
.chat-convo{display:flex;gap:10px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.chat-convo:hover{background:#fff}
.chat-convo b{font-size:13.5px}
.chat-thread{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:70vh}
.chat-thread-head{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-thread-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.chat-msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4}
.chat-msg.user{align-self:flex-start;background:var(--surface-2)}
.chat-msg.me{align-self:flex-end;background:var(--primary);color:#fff}
.chat-msg .t{display:block;margin-top:3px;font-size:10.5px;opacity:.7}
.chat-thread-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chat-thread-input input{flex:1}
.receipt-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer}

html[data-theme="dark"]{--bg:#0a0f17;--surface:#111925;--surface-2:#182230;--line:#293548;--text:#edf2f8;--muted:#9aa8b8;--primary:#6d8cff;--danger:#ff6670}
html[data-theme="dark"] body{background:var(--bg);color:var(--text)}
html[data-theme="dark"] header{background:#0e1622!important}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#0d1520;color:var(--text);border-color:var(--line)}

/* LIQUID GLASS */
.panel,.kpi,.chat-thread,.chat-list,.modal-box,.topbar,.tabbar{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.50));box-shadow:0 20px 60px -30px rgba(33,58,99,.28),inset 0 1px 0 rgba(255,255,255,.7)}
html[data-theme="dark"] .panel,html[data-theme="dark"] .kpi,html[data-theme="dark"] .chat-thread,html[data-theme="dark"] .chat-list,html[data-theme="dark"] .modal-box,html[data-theme="dark"] .topbar,html[data-theme="dark"] .tabbar{background:linear-gradient(145deg,rgba(24,34,48,.86),rgba(12,20,31,.74));box-shadow:0 24px 70px -32px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
.admin-shell{box-shadow:inset 0 0 100px rgba(77,121,255,.04)}

<script>
const CFG=window.SKILLMATE_CONFIG||{};
const SB=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;

window.ADMIN_API=(CFG.MEDIA_API||"").replace(/\/$/,"");
window.ADMIN_TOKEN=sessionStorage.getItem("sm_admin_token")||"";
async function backendAdminLogin(email,password){
  if(!ADMIN_API) throw new Error("Admin backend URL is not configured (MEDIA_API is blank in config.js) — cannot verify credentials.");
  const r=await fetch(ADMIN_API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const out=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(out.error||"Login failed");
  window.ADMIN_TOKEN=out.token;sessionStorage.setItem("sm_admin_token",out.token);return true;
}
function resetLocalData(){
  if(!confirm("Clear browser-stored test data on this device?"))return;
  const keep=["sm_admin","sm_admin_token","sm_admin_theme"];
  Object.keys(localStorage).filter(k=>k.startsWith("sm_")&&!keep.includes(k)).forEach(k=>localStorage.removeItem(k));
  toast("Local test data cleared"); setTimeout(()=>location.reload(),500);
}
async function inspectUser(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  let payload=null;
  if(ADMIN_API && ADMIN_TOKEN){try{const r=await fetch(ADMIN_API+"/api/admin/users/"+encodeURIComponent(id),{headers:{Authorization:"Bearer "+ADMIN_TOKEN}});const out=await r.json();if(r.ok)payload=out.data;}catch{}}
  const d=payload||{profiles:[u],requests:DB.requests.filter(x=>x.user_id===id),applications:DB.applications.filter(x=>x.user_id===id),reports:DB.reports.filter(x=>x.user_id===id),messages:DB.messages.filter(x=>x.user_id===id||x.sender_id===id||x.recipient_id===id),reviews:DB.reviews.filter(x=>x.reviewer_id===id||x.reviewee_id===id),verification_requests:DB.verification_requests.filter(x=>x.user_id===id),featured_requests:DB.featured_requests.filter(x=>x.user_id===id),referrals:DB.referrals.filter(x=>x.referrer_id===id||x.referred_id===id),withdrawals:DB.withdrawals.filter(x=>x.user_id===id),activity_log:(DB.activity_log||[]).filter(x=>x.user_id===id)};
  const rawProfile=(d.profiles||[u])[0]||u; const {password:_,...profile}=rawProfile;
  const modal=document.createElement("div");modal.className="modal";modal.innerHTML=`<div class="modal-box" style="width:min(1100px,94vw);max-height:88vh;overflow:auto"><div class="spread"><div><h2>${esc(profile.name||"User")}</h2><p class="meta">${esc(profile.email||"")} • ${esc(profile.phone||"")}</p></div><button class="btn ghost" onclick="this.closest('.modal').remove()">Close</button></div>
  <div class="panel" style="margin-top:14px"><h3>Account details</h3><pre style="white-space:pre-wrap;overflow:auto;font-size:12px">${esc(JSON.stringify(profile,null,2))}</pre></div>
  <div class="form-grid" style="margin-top:14px">
    <div class="panel"><h3>Listings (${(d.requests||[]).length})</h3>${(d.requests||[]).map(x=>`<div class="mini"><b>${esc(x.title||x.skill||"Listing")}</b><span class="meta">${esc(x.status||"")}</span></div>`).join("")||'<div class="empty">None</div>'}</div>
    <div class="panel"><h3>Applications (${(d.applications||[]).length})</h3>${(d.applications||[]).map(x=>`<div class="mini"><b>${esc(x.status||"Application")}</b><span class="meta">${esc(x.request_id||"")}</span></div>`).join("")||'<div class="empty">None</div>'}</div>
    <div class="panel"><h3>Messages (${(d.messages||[]).length})</h3>${(d.messages||[]).slice(0,40).map(x=>`<div class="mini"><b>${esc(x.sender_id===id?"Sent":"Received")}</b><span class="meta">${esc((x.body||"").slice(0,140))}</span></div>`).join("")||'<div class="empty">None</div>'}</div>
    <div class="panel"><h3>Activity (${(d.activity_log||[]).length})</h3>${(d.activity_log||[]).slice(0,100).map(x=>`<div class="mini"><b>${esc(x.action)}</b><span class="meta">${esc(new Date(x.created_at).toLocaleString())}</span><div class="meta">${esc(JSON.stringify(x.details||{}))}</div></div>`).join("")||'<div class="empty">No activity recorded</div>'}</div>
  </div></div>`;document.body.appendChild(modal);
}

const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem("sm_"+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem("sm_"+k,JSON.stringify(v))};
let DB={users:LS.get("users",[]),requests:LS.get("requests",[]),applications:LS.get("applications",[]),reports:LS.get("reports",[]),messages:LS.get("messages",[]),
  reviews:LS.get("reviews",[]),verification_requests:LS.get("verification_requests",[]),featured_requests:LS.get("featured_requests",[]),
  referrals:LS.get("referrals",[]),withdrawals:LS.get("withdrawals",[]),activity_log:LS.get("activity_log",[]),announcements:LS.get("announcements",[]),
  demo_requests:LS.get("demo_requests",[]), social_videos:LS.get("social_videos",[]), social_updates:LS.get("social_updates",[]), social_follows:LS.get("social_follows",[]), social_likes:LS.get("social_likes",[]), social_saves:LS.get("social_saves",[]), social_comments:LS.get("social_comments",[])};
const save=()=>Object.keys(DB).forEach(k=>LS.set(k,DB[k]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
let TAB="listings";
let CHAT_SELECTED=null, CHAT_VIEW="list", CHAT_SHELL_FOR=null;

async function adminLogin(){
  // Admin login always goes through the Render backend's /api/admin/login,
  // which checks the ADMIN_EMAIL / ADMIN_PASSWORD / JWT_SECRET set in Render's
  // environment. The old hardcoded "admin@skillmate.ng" / "admin123" local
  // fallback has been removed — it only ever ran when MEDIA_API was blank,
  // which made real Render credentials look "wrong" since they were never
  // actually being checked against Render at all.
  if(!aUser.value.trim()||!aPass.value) return toast("Enter your administrator credentials");
  try{
    await backendAdminLogin(aUser.value.trim().toLowerCase(),aPass.value);
    sessionStorage.setItem("sm_admin","1");
    boot();
  }catch(e){ toast(e.message||"Login failed"); }
}
function adminOut(){sessionStorage.removeItem("sm_admin");location.reload()}
function tab(t){
  if(t==="chat" && TAB!=="chat"){ CHAT_VIEW="list"; CHAT_SELECTED=null; CHAT_SHELL_FOR=null; }
  if(t==="owner" && TAB!=="owner"){ OWNER_SHELL_BUILT=false; }
  TAB=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  tabTitle.textContent=b_title(t);render()}
const b_title=t=>({listings:"Listings",business:"Business approvals",verify:"Verification Requests",featured:"Featured Requests",withdrawals:"Withdrawal Requests",users:"Users",reports:"Reports",apps:"Applications",chat:"Support Chat",owner:"Owner Profile",announcements:"Announcements",audit:"Account Audit",reset:"Data tools",demo:"Sample Listings",social:"Social Media"}[t]);

async function pull(){
  if(!SB){
    // Keep locally stored records in sync when the database connection is unavailable.
    Object.keys(DB).forEach(k=>{ DB[k]=LS.get(k,DB[k]); });
    return;
  }
  const [u,r,a,rep,msg,rv,vr,fr,rf,wd,al,an,dr]=await Promise.all([SB.from("profiles").select("*"),SB.from("requests").select("*"),
    SB.from("applications").select("*"),SB.from("reports").select("*"),SB.from("messages").select("*").order("created_at",{ascending:true}),
    SB.from("reviews").select("*"),SB.from("verification_requests").select("*").order("created_at",{ascending:false}),
    SB.from("featured_requests").select("*").order("created_at",{ascending:false}),
    SB.from("referrals").select("*"),SB.from("withdrawals").select("*").order("created_at",{ascending:false}),SB.from("activity_log").select("*").order("created_at",{ascending:false}),SB.from("announcements").select("*").order("created_at",{ascending:false}),
    SB.from("demo_requests").select("*").order("created_at",{ascending:false})]);
  if(u.data)DB.users=u.data; if(r.data)DB.requests=r.data; if(a.data)DB.applications=a.data; if(rep.data)DB.reports=rep.data;
  if(msg.data)DB.messages=msg.data; if(rv.data)DB.reviews=rv.data; if(vr.data)DB.verification_requests=vr.data; if(fr.data)DB.featured_requests=fr.data;
  if(rf.data)DB.referrals=rf.data; if(wd.data)DB.withdrawals=wd.data; if(al.data)DB.activity_log=al.data; if(an.data)DB.announcements=an.data;
  if(dr.data)DB.demo_requests=dr.data;
  const social=await Promise.all([SB.from("social_videos").select("*").order("created_at",{ascending:false}),SB.from("social_updates").select("*").order("created_at",{ascending:false}),SB.from("social_follows").select("*"),SB.from("social_likes").select("*"),SB.from("social_saves").select("*"),SB.from("social_comments").select("*").order("created_at",{ascending:true})]);
  ["social_videos","social_updates","social_follows","social_likes","social_saves","social_comments"].forEach((k,i)=>{if(!social[i].error)DB[k]=social[i].data||[];});
  save();
}
async function push(table,id,patch){
  if(!SB) return;
  // .select() is required to actually see whether a row came back. Without it,
  // Supabase returns no error and no data even when your RLS policy silently
  // matched zero rows (wrong role, a since-changed policy, a schema not
  // matching this app's schema.sql, etc.) — so approve/verify buttons looked
  // like they worked, then reverted back to "pending" on the next reload with
  // no explanation. Now a blocked/failed write throws so the caller's
  // .catch() reverts the UI and shows a real error instead of staying silent.
  const {data,error}=await SB.from(table).update(patch).eq("id",id).select();
  if(error) throw error;
  if(!data || !data.length){
    throw new Error(`Update to "${table}" didn't affect any row — check that this row's id still exists in Supabase and that your RLS update policy on "${table}" allows it.`);
  }
}
function cryptoId(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

// Deterministic-ish generator for realistic-looking demo listings.
// Categories: job (business hiring/apprenticeship), creator (brand collab), apprentice (available for work)

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr,n){ const c=[...arr]; const out=[]; while(out.length<n && c.length){ out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return out; }
function uid(prefix){ return (prefix||"demo")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function generateBatch(n){
  // Guarantee a real mix rather than leaving it to chance: roughly half job
  // listings, a quarter each of apprentice-available and creator collabs.
  const nJob=Math.round(n*0.5), nApp=Math.round(n*0.25), nCreator=n-nJob-nApp;
  const out=[];
  for(let i=0;i<nJob;i++) out.push(makeJobListing());
  for(let i=0;i<nApp;i++) out.push(makeApprenticeListing());
  for(let i=0;i<nCreator;i++) out.push(makeCreatorListing());
  return shuffle(out);
}

/* ---------- sample listing generator ----------
   Creates realistic-looking listings kept in their own demo_requests table —
   completely separate from real listings, never labeled as samples on the
   public site. */
function seedDemoListings(n){
  const batch = generateBatch(n);
  DB.demo_requests = [...batch, ...DB.demo_requests]; save(); render();
  toast(n>=30 ? "Generating "+n+" sample listings…" : "Adding "+n+" more sample listings…");
  if(SB){
    SB.from("demo_requests").insert(batch).then(({error})=>{
      if(error){
        DB.demo_requests = DB.demo_requests.filter(d=>!batch.some(b=>b.id===d.id));
        save(); render();
        toast("Could not save sample listings — "+(error.message||"try again"));
      } else {
        toast(n+" sample listings are live");
      }
    });
  }
}
function deleteDemoListing(id){
  const removed = DB.demo_requests.find(d=>d.id===id);
  DB.demo_requests = DB.demo_requests.filter(d=>d.id!==id); save(); render();
  if(SB) SB.from("demo_requests").delete().eq("id",id).then(({error})=>{
    if(error && removed){ DB.demo_requests.unshift(removed); save(); render(); toast("Could not delete — reverted"); }
  });
}
function clearDemoListings(){
  if(!confirm("Remove all sample listings from the site? This can't be undone.")) return;
  const removed = DB.demo_requests; const ids = removed.map(d=>d.id);
  DB.demo_requests = []; save(); render();
  toast("Sample listings cleared");
  if(SB && ids.length) SB.from("demo_requests").delete().in("id",ids).then(({error})=>{
    if(error){ DB.demo_requests = removed; save(); render(); toast("Could not clear — reverted"); }
  });
}

   A real, visible profile (shown with a 👑 badge on the public site) that

const OWNER_ID="skillmate_owner";

let OWNER_SHELL_BUILT=false; // see renderOwnerTab()
function compressImageAdmin(file,maxDim,quality){
  maxDim=maxDim||600; quality=quality||0.75;
  return new Promise((resolve)=>{
    if(!file.type||!file.type.startsWith("image")){ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(file); return; }
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>resolve(reader.result);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

async function saveOwnerProfile(){
  const name=document.getElementById("ownName").value.trim();
  const email=document.getElementById("ownEmail").value.trim().toLowerCase();
  if(!name||!email) return toast("Name and email are required");
  const existing=DB.users.find(u=>u.id===OWNER_ID||u.is_owner);
  const pass=document.getElementById("ownPass").value;
  const patch={
    name, email,
    phone:document.getElementById("ownPhone").value.trim(),
    business_name:document.getElementById("ownBiz").value.trim(),
    state:document.getElementById("ownState").value.trim(),
    city:document.getElementById("ownCity").value.trim(),
    bio:document.getElementById("ownBio").value.trim(),
    verified:true, is_owner:true, status:"active", email_verified:true, skill:"Skill Mate Team"
  };
  if(OWNER_AVATAR) patch.avatar=OWNER_AVATAR;
  if(pass) patch.password=pass;
  try{
    if(existing){
      if(SB) await SB.from("profiles").update(patch).eq("id",existing.id);
      Object.assign(existing,patch);
    } else {
      const full={...patch, id:OWNER_ID, role:"admin",
        avatar:patch.avatar||"https://api.dicebear.com/7.x/initials/svg?seed="+encodeURIComponent(name),
        password:pass||Math.random().toString(36).slice(2,10), created_at:new Date().toISOString()};
      if(SB){ const {error}=await SB.from("profiles").insert(full); if(error) throw error; }
      DB.users.push(full);
    }
    save(); toast("Owner profile saved"); OWNER_SHELL_BUILT=false; renderOwnerTab();
  }catch(e){ toast("Could not save: "+e.message); }
}

function table(cols,rows){
  if(!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  return `<div style="overflow:auto"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function verify(id){
  const u=DB.users.find(x=>x.id===id); if(!u)return;
  const prev=u.verified; u.verified=!u.verified; save(); render();
  toast(u.verified?"Business verified ✔":"Verification revoked");
  push("profiles",id,{verified:u.verified}).catch(()=>{ u.verified=prev; save(); render(); toast("Could not save — reverted"); });
}
function suspend(id){
  const u=DB.users.find(x=>x.id===id); if(!u)return;
  const prev=u.status; u.status=u.status==="suspended"?"active":"suspended"; save(); render();
  toast("User "+u.status);
  push("profiles",id,{status:u.status}).catch(()=>{ u.status=prev; save(); render(); toast("Could not save — reverted"); });
}
function toggleListing(id){
  const r=DB.requests.find(x=>x.id===id); if(!r)return;
  const prev=r.status; r.status=r.status==="removed"?"active":"removed"; save(); render();
  toast("Listing "+r.status);
  push("requests",id,{status:r.status}).catch(()=>{ r.status=prev; save(); render(); toast("Could not save — reverted"); });
}
function feature(id){

  push("requests",id,{featured:r.featured}).catch(()=>{ r.featured=prev; save(); render(); toast("Could not save — reverted"); });

function resolve(id){

  const prev=r.status; r.status="resolved"; save(); render();
  toast("Report resolved");
  push("reports",id,{status:"resolved"}).catch(()=>{ r.status=prev; save(); render(); toast("Could not save — reverted"); });
}

function verifyUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u)return;
  const prev=u.verified, next=!prev;
  u.verified=next; save(); render();
  toast(next?"Account verified ✔":"Account verification removed");
  (async()=>{
    try{
      if(ADMIN_API&&ADMIN_TOKEN){
        const r=await fetch(ADMIN_API+"/api/admin/users/"+encodeURIComponent(id)+"/status",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ADMIN_TOKEN},body:JSON.stringify({verified:next})});
        const out=await r.json(); if(!r.ok) throw new Error(out.error||"Could not update account");
        Object.assign(u,out.user||{verified:next}); save(); render();
      } else {
        await push("profiles",id,{verified:next});
      }
    }catch(e){ u.verified=prev; save(); render(); toast(e.message||"Could not update account — reverted"); }
  })();
}
function banUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u)return;
  const banning=u.status!=="banned"; const prev=u.status; const next=banning?"banned":"active";
  u.status=next; save(); render();
  toast(banning?"Account banned":"Account unbanned");
  (async()=>{
    try{
      if(ADMIN_API&&ADMIN_TOKEN){
        const r=await fetch(ADMIN_API+"/api/admin/users/"+encodeURIComponent(id)+"/status",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ADMIN_TOKEN},body:JSON.stringify({status:next})});
        const out=await r.json(); if(!r.ok) throw new Error(out.error||"Could not update account");
        Object.assign(u,out.user||{status:next}); save(); render();
      } else {
        await push("profiles",id,{status:next});
      }
    }catch(e){ u.status=prev; save(); render(); toast(e.message||"Could not update account — reverted"); }
  })();
}
function createAnnouncement(){
  const title=document.getElementById("annTitle")?.value.trim(), message=document.getElementById("annMessage")?.value.trim();
  const force=document.getElementById("annForce")?.value==="true";
  const target_user_id=document.getElementById("annTarget")?.value||null;
  if(!title||!message)return toast("Enter a title and message");
  const row={id:"ann_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),title,message,force,target_user_id,status:"published",created_at:new Date().toISOString()};
  DB.announcements.unshift(row); save(); render();
  toast(target_user_id?"Private announcement sent":(force?"Force announcement published":"Announcement published"));
  if(document.getElementById("annTitle")) document.getElementById("annTitle").value="";
  if(document.getElementById("annMessage")) document.getElementById("annMessage").value="";
  (async()=>{
    try{
      if(window.ADMIN_API && window.ADMIN_TOKEN){
        const r=await fetch(window.ADMIN_API+"/api/admin/announcements",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+window.ADMIN_TOKEN},body:JSON.stringify({title,message,force,target_user_id})});
        const out=await r.json(); if(!r.ok) throw new Error(out.error||"failed");
        if(out.announcement){ Object.assign(row,out.announcement); save(); }
      } else if(SB){
        const {error}=await SB.from("announcements").insert(row); if(error) throw error;
      }
    }catch(e){
      DB.announcements=DB.announcements.filter(a=>a.id!==row.id); save(); render();
      toast("Could not publish — "+(e.message||"try again"));
    }
  })();
}
function archiveAnnouncement(id){
  const x=DB.announcements.find(a=>a.id===id); if(!x)return;
  const prev=x.status; x.status="archived"; save(); render();
  toast("Announcement archived");
  if(SB) SB.from("announcements").update({status:"archived"}).eq("id",id).then(({error})=>{ if(error){ x.status=prev; save(); render(); toast("Could not archive — reverted"); } });
}
function toggleAdminTheme(){

/* ---------- verification & featured-request approvals ---------- */
function approveVerification(id){
  const v=DB.verification_requests.find(x=>x.id===id); if(!v)return;
  const prevV=v.status; v.status="approved";
  const u=DB.users.find(x=>x.id===v.user_id); const prevU=u?u.verified:undefined;
  if(u) u.verified=true;
  save(); render(); toast("Verification approved ✔");
  Promise.all([push("verification_requests",id,{status:"approved"}), u?push("profiles",u.id,{verified:true}):Promise.resolve()])
    .catch(()=>{ v.status=prevV; if(u) u.verified=prevU; save(); render(); toast("Could not save — reverted"); });
}
function rejectVerification(id){
  const note=prompt("Reason for rejection (shown to the user):")||"";
  const v=DB.verification_requests.find(x=>x.id===id); if(!v)return;
  const prev={status:v.status,admin_note:v.admin_note};
  v.status="rejected"; v.admin_note=note; save(); render(); toast("Verification rejected");
  push("verification_requests",id,{status:"rejected",admin_note:note}).catch(()=>{ Object.assign(v,prev); save(); render(); toast("Could not save — reverted"); });
}
function approveFeatured(id){
  const f=DB.featured_requests.find(x=>x.id===id); if(!f)return;
  const prevF=f.status; f.status="approved";
  const r=DB.requests.find(x=>x.id===f.request_id); const prevR=r?r.featured:undefined;
  if(r) r.featured=true;
  save(); render(); toast("Listing featured ★");
  Promise.all([push("featured_requests",id,{status:"approved"}), r?push("requests",r.id,{featured:true}):Promise.resolve()])
    .catch(()=>{ f.status=prevF; if(r) r.featured=prevR; save(); render(); toast("Could not save — reverted"); });
}
function rejectFeatured(id){
  const f=DB.featured_requests.find(x=>x.id===id); if(!f)return;
  const prev=f.status; f.status="rejected"; save(); render(); toast("Featured request rejected");
  push("featured_requests",id,{status:"rejected"}).catch(()=>{ f.status=prev; save(); render(); toast("Could not save — reverted"); });
}

/* ---------- withdrawal approvals ---------- */
// The requested amount is deducted from the user's wallet_balance up-front (at
// request time, in index.html). Approving here just confirms the manual bank
// payout was made; rejecting refunds the amount back to their wallet_balance.
function approveWithdrawal(id){
  const w=DB.withdrawals.find(x=>x.id===id); if(!w)return;
  const prev=w.status; w.status="approved"; save(); render();
  toast("Marked as paid ✔");
  push("withdrawals",id,{status:"approved"}).catch(()=>{ w.status=prev; save(); render(); toast("Could not save — reverted"); });
}
function rejectWithdrawal(id){
  const w=DB.withdrawals.find(x=>x.id===id); if(!w)return;
  const prevW=w.status; w.status="rejected";
  const u=DB.users.find(x=>x.id===w.user_id); const prevBal=u?u.wallet_balance:undefined;
  if(u) u.wallet_balance=Number(u.wallet_balance||0)+Number(w.amount||0);
  save(); render(); toast("Withdrawal rejected — funds refunded to user");
  Promise.all([push("withdrawals",id,{status:"rejected"}), u?push("profiles",u.id,{wallet_balance:u.wallet_balance}):Promise.resolve()])
    .catch(()=>{ w.status=prevW; if(u) u.wallet_balance=prevBal; save(); render(); toast("Could not save — reverted"); });
}

/* ---------- support chat tab ----------
   Two "pages" in the same panel: a conversation list, and a single thread
   view with a back button (top right). The thread's DOM shell (header +
   message container + reply input) is only rebuilt when switching to a
   different conversation — the 5s poll only refreshes the message bubbles
   inside #chatThreadBody. This matters: rebuilding the whole shell on every
   poll used to destroy and recreate the <input>, which stole focus and
   closed the mobile keyboard while typing a reply. */
function renderChatTab(q){
  const qEl=document.getElementById("q");
  if(qEl) qEl.style.display = (CHAT_VIEW==="thread") ? "none" : "";
  if(CHAT_VIEW==="thread" && CHAT_SELECTED) renderChatThread();
  else { CHAT_VIEW="list"; renderChatList(q); }
}
function renderChatList(q){
  const convos={};
  // Only rows with no chat_type (legacy) or "support" are customer-support
  // messages. Was excluding "listing" only, so user-to-user "direct" chats
  // (which also stamp user_id on the sender's messages) were leaking into
  // this inbox — fixed to require chat_type is actually support.
  DB.messages.filter(m=>(m.chat_type||"support")==="support").forEach(m=>{ (convos[m.user_id]=convos[m.user_id]||[]).push(m); });
  let rows=Object.keys(convos).map(uidKey=>{
    const msgs=convos[uidKey].slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    const last=msgs[msgs.length-1];
    const unread=msgs.filter(m=>m.sender==="user"&&!m.read_by_admin).length;
    const u=DB.users.find(x=>x.id===uidKey)||{name:"Unknown user",avatar:"",email:""};
    return {uid:uidKey,u,last,unread};
  });
  if(q) rows=rows.filter(c=>match(c.u,q)||match(c.last,q));
  rows.sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
  document.getElementById("tableBox").innerHTML = rows.length
    ? `<div class="chat-list">${rows.map(c=>`
      <div class="chat-convo" onclick="selectChat('${c.uid}')">
        <img class="av" src="${esc(c.u.avatar)}"/>
        <div style="flex:1;min-width:0">
          <div class="spread"><b>${esc(c.u.name)}</b>${c.unread?`<span class="badge red">${c.unread}</span>`:""}</div>
          <div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.last.body)}</div>
        </div></div>`).join("")}</div>`
    : `<div class="empty">No messages yet.</div>`;
}
function selectChat(uidKey){
  CHAT_SELECTED=uidKey; CHAT_VIEW="thread"; CHAT_SHELL_FOR=null;
  renderChatTab();
}
function backToChatList(){
  CHAT_VIEW="list"; CHAT_SELECTED=null; CHAT_SHELL_FOR=null;
  renderChatTab((document.getElementById("q").value||"").toLowerCase());
}
function renderChatThread(){
  const u=DB.users.find(x=>x.id===CHAT_SELECTED)||{name:"Unknown user",email:""};
  if(CHAT_SHELL_FOR!==CHAT_SELECTED){
    document.getElementById("tableBox").innerHTML = `<div class="chat-thread">
      <div class="chat-thread-head spread">
        <div><b>${esc(u.name)}</b><div class="meta">${esc(u.email||"")}</div></div>
        <button class="btn ghost sm" onclick="backToChatList()">Back →</button>
      </div>
      <div class="chat-thread-body" id="chatThreadBody"></div>
      <div class="chat-thread-input"><input id="adminReply" placeholder="Type a reply…" onkeydown="if(event.key==='Enter'){event.preventDefault();sendAdminReply()}"/>
        <button class="btn" onclick="sendAdminReply()">Send</button></div>
    </div>`;
    CHAT_SHELL_FOR=CHAT_SELECTED;
  }
  const msgs=DB.messages.filter(m=>m.user_id===CHAT_SELECTED&&(m.chat_type||"support")==="support").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  updateChatMessages(msgs,u);
  markAdminRead(CHAT_SELECTED,msgs);
}
function updateChatMessages(msgs,u){
  const body=document.getElementById("chatThreadBody"); if(!body) return;
  body.innerHTML = msgs.length ? msgs.map(m=>
    `<div class="chat-msg ${m.sender==="admin"?"me":"user"}">${esc(m.body)}<span class="t">${m.sender==="admin"?"You":esc(u.name)} • ${new Date(m.created_at).toLocaleString()}</span></div>`
  ).join("") : `<div class="empty">No messages yet.</div>`;
  body.scrollTop=body.scrollHeight;
}
async function markAdminRead(uidKey,msgs){
  const unread=msgs.filter(m=>m.sender==="user"&&!m.read_by_admin);
  if(!unread.length) return;
  const prevSnapshot=unread.map(m=>m); // same objects — flip back on failure
  unread.forEach(m=>m.read_by_admin=true); save(); kpis();
  if(SB){
    // Same silent-failure trap as push(): without .select(), a blocked/failed
    // update returns no error and no data, so this used to look like it saved
    // and then quietly show "unread" again after the next reload/poll.
    const {data,error}=await SB.from("messages").update({read_by_admin:true}).eq("user_id",uidKey).eq("sender","user").eq("read_by_admin",false).select();
    if(error || !data || !data.length){
      prevSnapshot.forEach(m=>m.read_by_admin=false); save(); kpis(); renderChatTab();
      console.error("Failed to mark messages read_by_admin:",error||"no rows updated — check RLS policy on messages table");
      toast("Could not mark as read — see console for details");
    }
  }
}
async function sendAdminReply(){
  const input=document.getElementById("adminReply"); if(!input) return;
  const val=(input.value||"").trim(); if(!val||!CHAT_SELECTED) return;
  const m={id:cryptoId(),user_id:CHAT_SELECTED,sender:"admin",chat_type:"support",body:val,read_by_admin:true,read_by_user:false,created_at:new Date().toISOString()};
  input.value=""; DB.messages.push(m); save();
  if(SB){ const {error}=await SB.from("messages").insert(m); if(error) toast("Failed to send"); }
  const msgs=DB.messages.filter(x=>x.user_id===CHAT_SELECTED&&(x.chat_type||"support")==="support").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const u=DB.users.find(x=>x.id===CHAT_SELECTED)||{name:"Unknown user"};
  updateChatMessages(msgs,u); // never touches the shell/input — keyboard stays open
  input.focus();
}

async function boot(){
  document.documentElement.dataset.theme=localStorage.getItem("sm_admin_theme")||"light";
  if(sessionStorage.getItem("sm_admin")!=="1")return;
  gate.style.display="none"; app.style.display="block";
  await pull(); render();
  setInterval(async()=>{
    if(sessionStorage.getItem("sm_admin")!=="1")return;
    await pull();
    render();
  },4000);
}
boot();
</script>
